<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="874" viewBox="0 0 1000 874" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The flow of one question</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969DA"/></marker></defs>
<rect x="1" y="1" width="998" height="872" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<rect x="10" y="30" width="180" height="90" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="100" y="69" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="100" dy="0">sage</tspan></text><text x="100" y="95" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="100" dy="0">at the terminal</tspan></text><line x1="100" y1="120" x2="100" y2="854" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="4 6"/><rect x="210" y="30" width="180" height="90" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="300" y="69" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="300" dy="0">The sage</tspan></text><text x="300" y="95" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="300" dy="0">logbook</tspan></text><line x1="300" y1="120" x2="300" y2="854" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="4 6"/><rect x="410" y="30" width="180" height="90" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="500" y="69" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="500" dy="0">The bridge</tspan></text><text x="500" y="95" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="500" dy="0">on the owner's Mac</tspan></text><line x1="500" y1="120" x2="500" y2="854" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="4 6"/><rect x="610" y="30" width="180" height="90" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="700" y="69" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="700" dy="0">The session</tspan></text><text x="700" y="95" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="700" dy="0">thread (Discord)</tspan></text><line x1="700" y1="120" x2="700" y2="854" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="4 6"/><rect x="810" y="30" width="180" height="90" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="900" y="69" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="900" dy="0">The team</tspan></text><text x="900" y="95" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="900" dy="0">both roles</tspan></text><line x1="900" y1="120" x2="900" y2="854" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="4 6"/><path d="M106 190 H292" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="114" y="178" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="114" dy="0">1  asks a question</tspan></text><path d="M106 268 H492" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="114" y="256" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="114" dy="0">2  marks it as a team vote (vote.mjs)</tspan></text><path d="M494 346 H308" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="314" y="334" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="314" dy="0">3  reads it, every 15 s</tspan></text><path d="M506 424 H692" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="514" y="412" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="514" dy="0">4  posts a card, pings both roles</tspan></text><path d="M894 502 H708" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="714" y="490" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="714" dy="0">5  presses an option</tspan></text><path d="M694 580 H508" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="514" y="568" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="514" dy="0">6  sends the press</tspan></text><path d="M500 648 h60 v24 h-52" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="572" y="654" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="572" dy="0">7  checks the role and the</tspan><tspan x="572" dy="25">     vote rules, edits the card</tspan></text><path d="M494 736 H308" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="314" y="724" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="314" dy="0">8  gives the final answer</tspan></text><path d="M294 814 H108" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="114" y="802" font-size="19" fill="#1F2328" text-anchor="start" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><tspan x="114" dy="0">9  sage reads it, goes on</tspan></text>
</svg>
