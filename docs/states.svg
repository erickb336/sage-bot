<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A question's life</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969DA"/></marker></defs>
<rect x="1" y="1" width="998" height="858" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
<rect x="100" y="30" width="260" height="80" rx="10" fill="#DDF4E4" stroke="#4AC26B" stroke-width="2"/><text x="230" y="64" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="230" dy="0">Withdrawn</tspan></text><text x="230" y="90" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="230" dy="0">sage gets nothing</tspan></text><rect x="20" y="180" width="360" height="490" rx="14" fill="none" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="8 6"/><rect x="100" y="200" width="260" height="80" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="230" y="234" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="230" dy="0">Open</tspan></text><text x="230" y="260" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="230" dy="0">a single question</tspan></text><rect x="100" y="360" width="260" height="80" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="230" y="394" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="230" dy="0">Voting</tspan></text><text x="230" y="420" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="230" dy="0">a batch of 2 to 4</tspan></text><rect x="100" y="520" width="260" height="80" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/><text x="230" y="554" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="230" dy="0">Tied</tspan></text><text x="230" y="580" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="230" dy="0">waits for a sage-lead</tspan></text><text x="40" y="628" font-size="19" fill="#59636E" text-anchor="start"><tspan x="40" dy="0">The owner can answer</tspan><tspan x="40" dy="25">in each of these.</tspan></text><circle cx="50" cy="240" r="9" fill="#1F2328"/><path d="M60 240 H92" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><circle cx="50" cy="400" r="9" fill="#1F2328"/><path d="M60 400 H92" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><path d="M230 200 V118" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="244" y="152" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="244" dy="0">the owner withdraws it</tspan><tspan x="244" dy="25">at the terminal</tspan></text><path d="M230 440 V512" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="244" y="470" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="244" dy="0">30 min end:</tspan><tspan x="244" dy="25">a tie or no votes</tspan></text><rect x="720" y="200" width="260" height="400" rx="10" fill="#DDF4E4" stroke="#4AC26B" stroke-width="2"/><text x="850" y="381" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="850" dy="0">Decided</tspan></text><text x="850" y="407" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="850" dy="0">the bridge gives</tspan><tspan x="850" dy="25">sage the answer</tspan></text><path d="M360 240 H712" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="396" y="228" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="396" dy="0">first press of a holder</tspan></text><path d="M360 400 H712" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="396" y="366" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="396" dy="0">30 min end with a clear leader,</tspan><tspan x="396" dy="25">or a sage-lead ends the vote</tspan></text><path d="M360 560 H712" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="396" y="548" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="396" dy="0">a sage-lead breaks the tie</tspan></text><path d="M230 670 V742" fill="none" stroke="#0969DA" stroke-width="2.5" marker-end="url(#head)"/><text x="244" y="712" font-size="19" fill="#1F2328" text-anchor="start"><tspan x="244" dy="0">the owner answers the chief</tspan></text><rect x="100" y="750" width="420" height="80" rx="10" fill="#DDF4E4" stroke="#4AC26B" stroke-width="2"/><text x="310" y="784" font-size="20" font-weight="600" fill="#1F2328" text-anchor="middle"><tspan x="310" dy="0">Answered at the terminal</tspan></text><text x="310" y="810" font-size="19" fill="#59636E" text-anchor="middle"><tspan x="310" dy="0">final: sage has it already</tspan></text>
</svg>
