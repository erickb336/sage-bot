<radialGradient id="safety-d-orb" cx="0.4" cy="0.38" r="0.65"><stop offset="0" stop-color="#FFF6D0"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF6A0F"/></radialGradient>
