<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">ON NOW · FOR EVERY ASK</tspan></text>
<rect x="40" y="70" width="1020" height="76" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="108" r="7" fill="#FF6A0F"/><text x="100" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">Roles and registered channels</tspan></text><text x="100" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">No sage role: no reply. Only the owner registers a channel.</tspan></text>
<rect x="40" y="156" width="1020" height="76" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="194" r="7" fill="#FF6A0F"/><text x="100" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">An hourly limit</tspan></text><text x="100" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">10 asks for each person in a rolling hour.</tspan></text>
<rect x="40" y="242" width="1020" height="76" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="280" r="7" fill="#FF6A0F"/><text x="100" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">No AI reads Discord text</tspan></text><text x="100" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Code answers read asks. A vote gives sage only the option.</tspan></text>
<rect x="40" y="328" width="1020" height="76" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="366" r="7" fill="#FF6A0F"/><text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The lead log</tspan></text><text x="100" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Each sage-lead message, hash-chained, copied to #sage-audit.</tspan></text>
<rect x="40" y="414" width="1020" height="76" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="452" r="7" fill="#FF6A0F"/><text x="100" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The kill switch</tspan></text><text x="100" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">/sage stop turns the link off. Only the owner turns it on.</tspan></text>
<text x="40" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">FOR BRIDGE SESSIONS · NOT ON YET (T159)</tspan></text>
<rect x="40" y="566" width="1020" height="76" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="604" r="7" fill="none" stroke="#8A705C" stroke-width="2"/><path d="M68 604 L 76 604" fill="none" stroke="#8A705C" stroke-width="2" stroke-linecap="round"/><text x="100" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The sandbox: the guarantee · built</tspan></text><text x="100" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">No GitHub host. Logbooks, sage and secrets denied.</tspan></text>
<rect x="40" y="652" width="1020" height="76" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="690" r="7" fill="none" stroke="#8A705C" stroke-width="2"/><path d="M68 690 L 76 690" fill="none" stroke="#8A705C" stroke-width="2" stroke-linecap="round"/><text x="100" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The guard hook · built · the broker · T158</tspan></text><text x="100" y="714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">An allow-list of commands. No broker verb merges.</tspan></text>
<rect x="40" y="738" width="1020" height="76" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="776" r="7" fill="none" stroke="#8A705C" stroke-width="2"/><path d="M68 776 L 76 776" fill="none" stroke="#8A705C" stroke-width="2" stroke-linecap="round"/><text x="100" y="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">A spend cap · built</tspan></text><text x="100" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">At most $5 of model use for each bridge session.</tspan></text>
</g>
<rect x="0.75" y="0.75" width="1098.5" height="858.5" rx="23.25" fill="none" stroke="#3A2414" stroke-width="1.5"/>
</svg>
