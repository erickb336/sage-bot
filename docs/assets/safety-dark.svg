<linearGradient id="safety-d-markR" x1="0" y1="0.5" x2="1" y2="0.3"><stop offset="0" stop-color="#B83A0A"/><stop offset="0.55" stop-color="#FF6A0F"/><stop offset="1" stop-color="#FFB050"/></linearGradient>
<linearGradient id="safety-d-markL" x1="1" y1="0.5" x2="0" y2="0.3"><stop offset="0" stop-color="#B83A0A"/><stop offset="0.55" stop-color="#FF6A0F"/><stop offset="1" stop-color="#FFB050"/></linearGradient>
<linearGradient id="safety-d-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040202"/><stop offset="0.32" stop-color="#1A110B"/><stop offset="0.6" stop-color="#33231A"/><stop offset="0.86" stop-color="#2C1E14"/><stop offset="1" stop-color="#3A2618"/></linearGradient>
<linearGradient id="safety-d-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2018"/><stop offset="1" stop-color="#100B08"/></linearGradient>
<linearGradient id="safety-d-bust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2018"/><stop offset="1" stop-color="#0A0604"/></linearGradient>
<linearGradient id="safety-d-hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#382A1F"/><stop offset="1" stop-color="#18120D"/></linearGradient>
<linearGradient id="safety-d-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33271D"/><stop offset="1" stop-color="#0D0907"/></linearGradient>
<radialGradient id="safety-d-disc" cx="0.5" cy="0.42" r="0.62"><stop offset="0" stop-color="#3B2B1E"/><stop offset="1" stop-color="#100B08"/></radialGradient>
<radialGradient id="safety-d-orb" cx="0.4" cy="0.38" r="0.65"><stop offset="0" stop-color="#FFF6D0"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF6A0F"/></radialGradient>
<linearGradient id="safety-d-fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4E6CC" stop-opacity="0.95"/><stop offset="1" stop-color="#F4E6CC" stop-opacity="0"/></linearGradient>
<linearGradient id="safety-d-word" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#FFF8EC"/><stop offset="0.5" stop-color="#FFD27A"/><stop offset="0.72" stop-color="#FF8A2A"/><stop offset="0.9" stop-color="#E2470A"/></linearGradient>
