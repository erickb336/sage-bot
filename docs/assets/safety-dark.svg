<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1220" width="1100" height="1220" role="img" aria-label="The guardrails: five layers are on now for every ask; four more (the sandbox, the guard hook, the broker and a spend cap) come with bridge sessions.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<defs>
<linearGradient id="safety-d-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080605"/><stop offset="0.45" stop-color="#1B120C"/><stop offset="0.72" stop-color="#22160E"/><stop offset="1" stop-color="#0A0706"/></linearGradient>
<radialGradient id="safety-d-haze"><stop offset="0" stop-color="#FF8A2A" stop-opacity="0.6"/><stop offset="0.5" stop-color="#FF6A0F" stop-opacity="0.2"/><stop offset="1" stop-color="#FF6A0F" stop-opacity="0"/></radialGradient>
<radialGradient id="safety-d-moonglow"><stop offset="0.55" stop-color="#F2CD96" stop-opacity="0.5"/><stop offset="1" stop-color="#F2CD96" stop-opacity="0"/></radialGradient>
