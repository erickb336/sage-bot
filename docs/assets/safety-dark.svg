ity="0.3"/><circle cx="160.4" cy="995.7" r="2.4" fill="#FF8A2A" opacity="0.4"/><circle cx="473.9" cy="653.2" r="2.6" fill="#FF8A2A" opacity="0.4"/><circle cx="301.2" cy="948.2" r="2.8" fill="#FF8A2A" opacity="0.4"/><circle cx="297.2" cy="81.4" r="2.2" fill="#FF8A2A" opacity="0.2"/><circle cx="441.8" cy="768.3" r="1.4" fill="#FF8A2A" opacity="0.3"/><circle cx="581.6" cy="22.7" r="1" fill="#FFC93C" opacity="0.3"/><circle cx="822.2" cy="244.9" r="1.2" fill="#FF8A2A" opacity="0.3"/><circle cx="561.7" cy="1305.7" r="2.5" fill="#FF8A2A" opacity="0.3"/><circle cx="748.4" cy="806.2" r="1.9" fill="#FF8A2A" opacity="0.4"/><circle cx="425.8" cy="295.1" r="2.2" fill="#FF8A2A" opacity="0.4"/>
<text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">ON NOW · FOR EVERY ASK</tspan></text>
<rect x="40" y="80" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="112" r="9" fill="#FF6A0F"/><text x="100" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">Roles and registered channels</tspan></text><text x="100" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Two roles, in the owner’s channels only.</tspan></text>
<rect x="40" y="204" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="236" r="9" fill="#FF6A0F"/><text x="100" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">An hourly limit</tspan></text><text x="100" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">10 asks for each person in a rolling hour.</tspan></text>
<rect x="40" y="328" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="360" r="9" fill="#FF6A0F"/><text x="100" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">No AI reads Discord text</tspan></text><text x="100" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Code answers. sage gets only the option.</tspan></text>
<rect x="40" y="452" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="484" r="9" fill="#FF6A0F"/><text x="100" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The sage-lead log</tspan></text><text x="100" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Hash-chained, with a copy in #sage-audit.</tspan></text>
<rect x="40" y="576" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="608" r="9" fill="#FF6A0F"/><text x="100" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The kill switch</tspan></text><text x="100" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">/sage stop. Only the owner undoes it.</tspan></text>
<rect x="40" y="700" width="1020" height="112" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="732" r="9" fill="#FF6A0F"/><text x="100" y="744" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The answer shows little</tspan></text><text x="100" y="794" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Task id, title, size, state, open questions.</tspan></text>
<text x="40" y="864" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">BRIDGE SESSIONS · NOT ON YET (T159)</tspan></text>
<rect x="40" y="884" width="1020" height="112" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="916" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 916 L 77 916" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="928" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The sandbox: file and network boundary · built</tspan></text><text x="100" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">No GitHub host, logbooks, sage or secrets.</tspan></text>
<rect x="40" y="1008" width="1020" height="112" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1040" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 1040 L 77 1040" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The guard hook · built</tspan></text><text x="100" y="1102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Only the commands on its allow-list.</tspan></text>
<rect x="40" y="1132" width="1020" height="112" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1164" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 1164 L 77 1164" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The broker · built</tspan></text><text x="100" y="1226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">A few GitHub verbs. None of them merges.</tspan></text>
<rect x="40" y="1256" width="1020" height="112" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1288" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 1288 L 77 1288" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">A spend cap · built</tspan></text><text x="100" y="1350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">At most $5 of model use for each session.</tspan></text>
</g>
<rect x="0.75" y="0.75" width="1098.5" height="1412.5" rx="23.25" fill="none" stroke="#3A2414" stroke-width="1.5"/>
</svg>
