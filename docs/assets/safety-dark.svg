le cx="160.4" cy="857.9" r="2.4" fill="#FF8A2A" opacity="0.4"/><circle cx="473.9" cy="563.8" r="2.6" fill="#FF8A2A" opacity="0.4"/><circle cx="301.2" cy="817.1" r="2.8" fill="#FF8A2A" opacity="0.4"/><circle cx="297.2" cy="72.8" r="2.2" fill="#FF8A2A" opacity="0.2"/><circle cx="441.8" cy="662.6" r="1.4" fill="#FF8A2A" opacity="0.3"/><circle cx="581.6" cy="22.3" r="1" fill="#FFC93C" opacity="0.3"/><circle cx="822.2" cy="213.2" r="1.2" fill="#FF8A2A" opacity="0.3"/><circle cx="561.7" cy="1124.2" r="2.5" fill="#FF8A2A" opacity="0.3"/><circle cx="748.4" cy="695.2" r="1.9" fill="#FF8A2A" opacity="0.4"/><circle cx="425.8" cy="256.2" r="2.2" fill="#FF8A2A" opacity="0.4"/>
<text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">ON NOW · FOR EVERY ASK</tspan></text>
<rect x="40" y="80" width="1020" height="104" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="112" r="9" fill="#FF6A0F"/><text x="100" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">Roles and registered channels</tspan></text><text x="100" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">No role: no reply. The owner registers channels.</tspan></text>
<rect x="40" y="196" width="1020" height="104" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="228" r="9" fill="#FF6A0F"/><text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">An hourly limit</tspan></text><text x="100" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">10 asks for each person in a rolling hour.</tspan></text>
<rect x="40" y="312" width="1020" height="104" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="344" r="9" fill="#FF6A0F"/><text x="100" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">No AI reads Discord text</tspan></text><text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Code answers. A vote gives sage only the option.</tspan></text>
<rect x="40" y="428" width="1020" height="104" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="460" r="9" fill="#FF6A0F"/><text x="100" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The sage-lead log</tspan></text><text x="100" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Hash-chained, with a copy in #sage-audit.</tspan></text>
<rect x="40" y="544" width="1020" height="104" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/><circle cx="72" cy="576" r="9" fill="#FF6A0F"/><text x="100" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The kill switch</tspan></text><text x="100" y="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">/sage stop. Only the owner turns it on again.</tspan></text>
<text x="40" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFC93C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">BRIDGE SESSIONS · NOT ON YET (T159)</tspan></text>
<rect x="40" y="732" width="1020" height="104" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="764" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 764 L 77 764" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="776" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The sandbox: the guarantee · built</tspan></text><text x="100" y="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">No GitHub host. Logbooks, sage, secrets denied.</tspan></text>
<rect x="40" y="848" width="1020" height="104" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="880" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 880 L 77 880" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The guard hook · built</tspan></text><text x="100" y="936" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">Only the commands on its allow-list.</tspan></text>
<rect x="40" y="964" width="1020" height="104" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="996" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 996 L 77 996" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1008" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">The broker · T158</tspan></text><text x="100" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">A few GitHub verbs. None of them merges.</tspan></text>
<rect x="40" y="1080" width="1020" height="104" rx="8" fill="#17100C" stroke="#8A705C" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1112" r="9" fill="none" stroke="#8A705C" stroke-width="2.5"/><path d="M67 1112 L 77 1112" fill="none" stroke="#8A705C" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFF3E6" text-anchor="start"><tspan x="100" dy="0">A spend cap · built</tspan></text><text x="100" y="1168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="100" dy="0">At most $5 of model use for each session.</tspan></text>
</g>
<rect x="0.75" y="0.75" width="1098.5" height="1218.5" rx="23.25" fill="none" stroke="#3A2414" stroke-width="1.5"/>
</svg>
