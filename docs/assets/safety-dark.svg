<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" role="img" aria-label="The guardrails. On now, for every ask: roles and registered channels, so a member with no sage role gets no reply and only the owner registers a channel; an hourly limit of 10 asks for each person; no AI reads Discord text, because code answers read asks and a vote gives sage only the option; the lead log, hash-chained and copied to #sage-audit; and the kill switch, /sage stop, which only the owner turns back on. For bridge sessions, not on yet (T159): the sandbox settings, built, which are the guarantee (G44 A), with no GitHub host and the logbooks, sage and secrets denied; the guard hook, built, and the broker, coming in T158, whose verbs never merge; and a spend cap, built, of 5 dollars of model use for each bridge session.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
