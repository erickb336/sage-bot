<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1030" width="1100" height="1030" role="img" aria-label="The two roles: a sage-apprentice reads and asks; a sage-lead can also break ties, end votes early, unregister a channel and turn off the link to sage.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
