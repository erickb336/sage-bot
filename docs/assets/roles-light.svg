<rect x="40" y="30" width="500" height="560" rx="10" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5"/><text x="70" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="70" dy="0">sage-apprentice</tspan></text><text x="70" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="70" dy="0">Read and ask.</tspan></text><circle cx="80" cy="168" r="7" fill="#E5600B"/><text x="102" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="102" dy="0">The board: tasks by state, tasks</tspan><tspan x="102" dy="30">left and the open questions</tspan></text><circle cx="80" cy="258" r="7" fill="#E5600B"/><text x="102" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="102" dy="0">One task, for example T7</tspan></text><circle cx="80" cy="314" r="7" fill="#E5600B"/><text x="102" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="102" dy="0">The open questions and options</tspan></text><circle cx="80" cy="370" r="7" fill="#E5600B"/><text x="102" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="102" dy="0">The project’s shared graphics</tspan><tspan x="102" dy="30">and PDFs</tspan></text><circle cx="80" cy="460" r="7" fill="#E5600B"/><text x="102" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="102" dy="0">Answer and vote on team questions</tspan></text><circle cx="80" cy="516" r="7" fill="none" stroke="#A88B75" stroke-width="2"/><path d="M76 516 L 84 516" fill="none" stroke="#A88B75" stroke-width="2" stroke-linecap="round"/><text x="102" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="102" dy="0">Time left: not estimated yet;</tspan><tspan x="102" dy="30">the board counts the tasks left</tspan></text>
<rect x="560" y="30" width="500" height="560" rx="10" fill="#FFFFFF" stroke="#E5600B" stroke-width="2"/><text x="590" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="590" dy="0">sage-lead</tspan></text><text x="590" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="590" dy="0">Everything an apprentice can do, plus:</tspan></text><circle cx="600" cy="168" r="7" fill="#E5600B"/><text x="622" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="622" dy="0">Break a tie, or end a vote early</tspan></text><circle cx="600" cy="224" r="7" fill="#E5600B"/><text x="622" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="622" dy="0">Recommend on the autopilot</tspan><tspan x="622" dy="30">question; the owner decides</tspan></text><circle cx="600" cy="314" r="7" fill="#E5600B"/><text x="622" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="622" dy="0">Unregister a channel</tspan></text><circle cx="600" cy="370" r="7" fill="#E5600B"/><text x="622" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="622" dy="0">/sage stop: turn off the link</tspan><tspan x="622" dy="30">from Discord to sage</tspan></text><circle cx="600" cy="460" r="7" fill="none" stroke="#A88B75" stroke-width="2"/><path d="M596 460 L