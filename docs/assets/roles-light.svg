<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-label="The two roles. sage-apprentice reads and asks: the board with tasks by state, tasks left and the open questions; one task such as T7; the open questions and their options; the shared graphics and PDFs; and answers and votes on team questions. Time left is not estimated yet. sage-lead can do everything an apprentice can, plus: break a tie or end a vote early; recommend on the autopilot question, where the owner decides; unregister a channel; and turn off the link from Discord to sage with /sage stop. Talking to sage, write operations and build sessions are not built yet (T159). A member with no role gets no answer.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
