<rect x="40" y="30" width="1020" height="462" rx="10" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5"/><text x="70" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="70" dy="0">sage-apprentice</tspan></text><text x="70" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="70" dy="0">Read and ask.</tspan></text><circle cx="84" cy="178" r="9" fill="#E5600B"/><text x="110" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">The board: tasks by state, open questions</tspan></text><circle cx="84" cy="230" r="9" fill="#E5600B"/><text x="110" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">One task, for example T7</tspan></text><circle cx="84" cy="282" r="9" fill="#E5600B"/><text x="110" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">The open questions and their options</tspan></text><circle cx="84" cy="334" r="9" fill="#E5600B"/><text x="110" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">The shared graphics and PDFs</tspan></text><circle cx="84" cy="386" r="9" fill="#E5600B"/><text x="110" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">Answer and vote on team questions</tspan></text><circle cx="84" cy="438" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M79 438 L 89 438" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="110" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="110" dy="0">Time left: not estimated yet</tspan></text>
<rect x="40" y="522" width="1020" height="410" rx="10" fill="#FFFFFF" stroke="#E5600B" stroke-width="2"/><text x="70" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="70" dy="0">sage-lead</tspan></text><text x="70" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="70" dy="0">All that an apprentice can do, plus:</tspan></text><circle cx="84" cy="670" r="9" fill="#E5600B"/><text x="110" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">Break a tie, or end a vote early</tspan></text><circle cx="84" cy="722" r="9" fill="#E5600B"/><text x="110" y="734" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">Recommend on autopilot; the owner decides</tspan></text><circle cx="84" cy="774" r="9" fill="#E5600B"/><text x="110" y="786" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">Unregister a channel</tspan></text><circle cx="84" cy="826" r="9" fill="#E5600B"/><text x="110" y="838" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#1A0E07" text-anchor="start"><tspan x="110" dy="0">/sage stop: turn off the link to sage</tspan></text><circle cx="84" cy="878" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M79 878 L 89 878" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="110" y="890" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="110" dy="0">Instruct sage and start builds (T159)</tspan></text>
<circle cx="60" cy="978" r="9" fill="#E5600B"/>
<text x="80" y="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="80" dy="0">built</tspan></text>
<circle cx="200" cy="978" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M195 978 L 205 978" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/>
<text x="220" y="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="220" dy="0">not built yet</tspan></text>
<text x="1060" y="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="end"><tspan x="1060" dy="0">No role: no answer.</tspan></text>
