<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="The round trip: the team messages sage from a Discord thread, the owner approves each message on a card, sage builds the project in Claude Code, and results come back to the thread. Delivery to sage and the replies are planned."><defs>
