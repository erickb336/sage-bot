<rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="27.5" fill="none" stroke="#DCE3EB" stroke-width="1.5"/><ellipse cx="210" cy="270" rx="300" ry="230" fill="url(#blg1)"/><ellipse cx="600" cy="120" rx="220" ry="120" fill="url(#blg2)"/><ellipse cx="990" cy="270" rx="300" ry="230" fill="url(#blg3)"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><rect x="60" y="150" width="300" height="236" rx="26" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#blsh)"/><circle cx="166" cy="218" r="30" fill="#5865F2" stroke="#FFFFFF" stroke-width="5"/><text x="166" y="227" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">M</text><circle cx="210" cy="218" r="30" fill="#C2569B" stroke="#FFFFFF" stroke-width="5"/><text x="210" y="227" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">J</text><circle cx="254" cy="218" r="30" fill="#2C8FB8" stroke="#FFFFFF" stroke-width="5"/><text x="254" y="227" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">A</text><text x="210" y="300" font-size="36" fill="#0F1729" text-anchor="middle" font-weight="700" letter-spacing="-0.5">The team</text><text x="210" y="338" font-size="24" fill="#5A6676" text-anchor="middle">posts in a</text><text x="210" y="368" font-size="24" fill="#5A6676" text-anchor="middle">Discord thread</text><rect x="840" y="150" width="300" height="236" rx="26" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#blsh)"/><g transform="translate(958 182)"><rect width="64" height="64" rx="17.92" fill="url(#blgg)"/><g transform="scale(1)"><rect x="12" y="16" width="40" height="32" rx="6" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M20 27l6 5-6 5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 38h12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g></g><text x="990" y="300" font-size="36" fill="#0F1729" text-anchor="middle" font-weight="700" letter-spacing="-0.5">sage</text><text x="990" y="338" font-size="24" fill="#5A6676" text-anchor="middle">builds the project</text><text x="990" y="368" font-size="24" fill="#5A6676" text-anchor="middle">in Claude Code</text><path d="M210 150 C 210 84, 400 64, 556 64" fill="none" stroke="#5865F2" stroke-width="4" stroke-linecap="round"/><path d="M644 64 C 800 64, 990 84, 990 146" fill="none" stroke="#1F9D63" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M979 134l11 14 11-14" fill="none" stroke="#1F9D63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="64" r="44" fill="url(#blga)" filter="url(#blsh)"/><g transform="translate(568 32)"><path d="M32 12l17 6v12c0 11-7.5 19-17 22-9.5-3-17-11-17-22V18z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><path d="M24 32l6 6 11-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="142" font-size="26" fill="#0F1729" text-anchor="middle" font-weight="650">The owner approves</text><text x="600" y="174" font-size="23" fill="#5A6676" text-anchor="middle">each message on a card</text><path d="M990 386 C 990 470, 780 476, 600 476 C 420 476, 210 470, 210 392" fill="none" stroke="#8A95A5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M199 402l11-14 11 14" fill="none" stroke="#8A95A5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="438" font-size="26" fill="#0F1729" text-anchor="middle" font-weight="650">Results come back to the thread</text><text x="600" y="272" font-size="25" fill="#5A6676" text-anchor="middle">Nothing from Discord</text><text x="600" y="304" font-size="25" fill="#5A6676" text-anchor="middle">reaches sage without</text><text x="600" y="336" font-size="25" fill="#5A6676" text-anchor="middle">the owner’s Approve.</text><text x="1168" y="498" font-size="19" fill="#8A95A5" text-anchor="end">Sample. Dotted: planned (T159, T160).</text></g></s