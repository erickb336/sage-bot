ge</text><text x="990" y="338" font-size="24" fill="#9AA6B6" text-anchor="middle">builds the project</text><text x="990" y="368" font-size="24" fill="#9AA6B6" text-anchor="middle">in Claude Code</text><path d="M210 150 C 210 84, 400 64, 556 64" fill="none" stroke="#7C86FF" stroke-width="4" stroke-linecap="round"/><path d="M644 64 C 800 64, 990 84, 990 146" fill="none" stroke="#3DD08F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M979 134l11 14 11-14" fill="none" stroke="#3DD08F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="64" r="44" fill="url(#bdga)" filter="url(#bdsh)"/><g transform="translate(568 32)"><path d="M32 12l17 6v12c0 11-7.5 19-17 22-9.5-3-17-11-17-22V18z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><path d="M24 32l6 6 11-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="142" font-size="26" fill="#E8EDF4" text-anchor="middle" font-weight="650">The owner approves</text><text x="600" y="174" font-size="23" fill="#9AA6B6" text-anchor="middle">each message on a card</text><path d="M990 386 C 990 470, 780 476, 600 476 C 420 476, 210 470, 210 392" fill="none" stroke="#6E7A8B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M199 402l11-14 11 14" fill="none" stroke="#6E7A8B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="438" font-size="26" fill="#E8EDF4" text-anchor="middle" font-weight="650">Results come back to the thread</text><text x="600" y="272" font-size="25" fill="#9AA6B6" text-anchor="middle">Nothing from Discord</text><text x="600" y="304" font-size="25" fill="#9AA6B6" text-anchor="middle">reaches sage without</text><text x="600" y="336" font-size="25" fill="#9AA6B6" text-anchor="middle">the owner’s Approve.</text><text x="1168" y="498" font-size="19" fill="#6E7A8B" text-anchor="end">Sample. Dotted: planned (T159, T160).</text></g></s