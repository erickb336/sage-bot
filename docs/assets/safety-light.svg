<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1290" width="1100" height="1290" role="img" aria-label="The guardrails: five layers are on now for every ask; four more (the sandbox, the guard hook, the broker and a spend cap) come with bridge sessions.">
<style>.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<defs>
