<radialGradient id="safety-l-haze"><stop offset="0" stop-color="#FF8A2A" stop-opacity="0.6"/><stop offset="0.5" stop-color="#FF6A0F" stop-opacity="0.2"/><stop offset="1" stop-color="#FF6A0F" stop-opacity="0"/></radialGradient>
<radialGradient id="safety-l-moonglow"><stop offset="0.55" stop-color="#F2CD96" stop-opacity="0.5"/><stop offset="1" stop-color="#F2CD96" stop-opacity="0"/></radialGradient>
<radialGradient id="safety-l-moon" cx="0.4" cy="0.36" r="0.72"><stop offset="0" stop-color="#F8E7C6"/><stop offset="0.6" stop-color="#E4BC88"/><stop offset="1" stop-color="#B8844F"/></radialGradient>
<radialGradient id="safety-l-iris" cx="0.51" cy="0.52" r="0.56"><stop offset="0" stop-color="#FFF4C2"/><stop offset="0.16" stop-color="#FFD54A"/><stop offset="0.4" stop-color="#FDB022"/><stop offset="0.66" stop-color="#EE7A0C"/><stop offset="0.86" stop-color="#A83E08"/><stop offset="1" stop-color="#4A1803"/></radialGradient>
<linearGradient id="safety-l-lid" x1="0" y1="0.34" x2="0" y2="0.96"><stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="safety-l-markR" x1="0" y1="0.5" x2="1" y2="0.3"><stop offset="0" stop-color="#B83A0A"/><stop offset="0.55" stop-color="#FF6A0F"/><stop offset="1" stop-color="#FFB050"/></linearGradient>
<linearGradient id="safety-l-markL" x1="1" y1="0.5" x2="0" y2="0.3"><stop offset="0" stop-color="#B83A0A"/><stop offset="0.55" stop-color="#FF6A0F"/><stop offset="1" stop-color="#FFB050"/></linearGradient>
<linearGradient id="safety-l-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040202"/><stop offset="0.32" stop-color="#1A110B"/><stop offset="0.6" stop-color="#33231A"/><stop offset="0.86" stop-color="#2C1E14"/><stop offset="1" stop-color="#3A2618"/></linearGradient>
<linearGradient id="safety-l-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2018"/><stop offset="1" stop-color="#100B08"/></linearGradient>
<linearGradient id="safety-l-bust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2018"/><stop offset="1" stop-color="#0A0604"/></linearGradient>
<linearGradient id="safety-l-hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#382A1F"/><stop offset="1" stop-color="#18120D"/></linearGradient>
<linearGradient id="safety-l-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33271D"/><stop offset="1" stop-color="#0D0907"/></linearGradient>
<radialGradient id="safety-l-disc" cx="0.5" cy="0.42" r="0.62"><stop offset="0" stop-color="#3B2B1E"/><stop offset="1" stop-color="#100B08"/></radialGradient>
<radialGradient id="safety-l-orb" cx="0.4" cy="0.38" r="0.65"><stop offset="0" stop-color="#FFF6D0"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF6A0F"/></radialGradient>
<linearGradient id="safety-l-fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4E6CC" stop-opacity="0.95"/><stop offset="1" stop-color="#F4E6CC" stop-opacity="0"/></linearGradient>
<linearGradient id="safety-l-word" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#FFF8EC"/><stop offset="0.5" stop-color="#FFD27A"/><stop offset="0.72" stop-color="#FF8A2A"/><stop offset="0.9" stop-color="#E2470A"/></linearGradient>
<linearGradient id="safety-l-ember" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA040"/><stop offset="1" stop-color="#F05A0A"/></linearGradient>
<filter id="safety-l-wordglow" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/><feFlood flood-color="#FF6A0F" flood-opacity="0.7"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="safety-l-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="safety-l-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="safety-l-mist" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="20"/></filter>
<marker id="safety-l-hot" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 L3 6 z" fill="#E5600B"/></marker>
<marker id="safety-l-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 L3 6 z" fill="#A88B75"/></marker>
<marker id="safety-l-bad" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 L3 6 z" fill="#C7361F"/></marker>
<marker id="safety-l-loop" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 L3 6 z" fill="#B4470C"/></marker>
<clipPath id="safety-l-frame"><rect width="1100" height="1290" rx="24"/></clipPath>
</defs>
<g clip-path="url(#safety-l-frame)">
<rect width="1100" height="1290" rx="24" fill="#FAF6F0"/>
