<text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#B4470C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">ON NOW · FOR EVERY ASK</tspan></text>
<rect x="40" y="80" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/><circle cx="72" cy="112" r="9" fill="#E5600B"/><text x="100" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">Roles and registered channels</tspan></text><text x="100" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">Two roles, in the owner’s channels only.</tspan></text>
<rect x="40" y="204" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/><circle cx="72" cy="236" r="9" fill="#E5600B"/><text x="100" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">An hourly limit</tspan></text><text x="100" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">10 asks for each person in a rolling hour.</tspan></text>
<rect x="40" y="328" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/><circle cx="72" cy="360" r="9" fill="#E5600B"/><text x="100" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">No AI reads Discord text</tspan></text><text x="100" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">Code answers. sage gets only the option.</tspan></text>
<rect x="40" y="452" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/><circle cx="72" cy="484" r="9" fill="#E5600B"/><text x="100" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">The sage-lead log</tspan></text><text x="100" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">Hash-chained, with a copy in #sage-audit.</tspan></text>
<rect x="40" y="576" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/><circle cx="72" cy="608" r="9" fill="#E5600B"/><text x="100" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">The kill switch</tspan></text><text x="100" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">/sage stop. Only the owner undoes it.</tspan></text>
<text x="40" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#B4470C" text-anchor="start" letter-spacing="2"><tspan x="40" dy="0">BRIDGE SESSIONS · NOT ON YET (T159)</tspan></text>
<rect x="40" y="760" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="792" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M67 792 L 77 792" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="804" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">The sandbox: the guarantee · built</tspan></text><text x="100" y="854" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">No GitHub host, logbooks, sage or secrets.</tspan></text>
<rect x="40" y="884" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="916" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M67 916 L 77 916" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="928" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">The guard hook · built</tspan></text><text x="100" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">Only the commands on its allow-list.</tspan></text>
<rect x="40" y="1008" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1040" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M67 1040 L 77 1040" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">The broker · built</tspan></text><text x="100" y="1102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">A few GitHub verbs. None of them merges.</tspan></text>
<rect x="40" y="1132" width="1020" height="112" rx="8" fill="#FFFFFF" stroke="#A88B75" stroke-width="1.5" stroke-dasharray="7 6"/><circle cx="72" cy="1164" r="9" fill="none" stroke="#A88B75" stroke-width="2.5"/><path d="M67 1164 L 77 1164" fill="none" stroke="#A88B75" stroke-width="2.5" stroke-linecap="round"/><text x="100" y="1176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1A0E07" text-anchor="start"><tspan x="100" dy="0">A spend cap · built</tspan></text><text x="100" y="1226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="100" dy="0">At most $5 of model use for each session.</tspan></text>
</g>
<rect x="0.75" y="0.75" width="1098.5" height="1288.5" rx="23.25" fill="none" stroke="#E8D9C6" stroke-width="1.5"/>
</svg>
