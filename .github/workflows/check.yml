# Runs the checks on each push to main and on each pull request. No secrets: the checks use sample data and a fake Discord.
# The runner is macOS, because the checks run macOS tools (plutil, ps -o lstart) as the owner's Mac does.
# Each action is pinned by its full commit SHA; the comment names its tag.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30 # the check takes about 2 minutes on a Mac; a hang stops here, not after 6 hours of macOS minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/diag-safe.mjs
        timeout-minutes: 5
      - run: ls -ld /tmp/claude-* /private/tmp/claude-* || echo no claude tmp; id -u
      - run: node --test --test-reporter=spec test/t156-mutations.test.js test/t157-proof.test.js
